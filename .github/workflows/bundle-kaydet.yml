name: Paket kimliğini Apple'a kaydet (com.anduv.gokalp)
on:
  workflow_dispatch:
env:
  ASC_KEY_ID: DJSHKK6T3P
  ASC_ISSUER_ID: f4943ef8-df6f-42c8-a561-58554097ea35
  BUNDLE: com.anduv.gokalp
  AD: Gokalp
jobs:
  kaydet:
    runs-on: ubuntu-latest
    steps:
      - run: pip install pyjwt cryptography requests
      - name: Bundle ID oluştur (varsa dokunma)
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          python3 - <<'EOF'
          import os, time, jwt, requests
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
                           os.environ["P8"], algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          h = {"Authorization": "Bearer " + tok}
          b = os.environ["BUNDLE"]
          r = requests.get("https://api.appstoreconnect.apple.com/v1/bundleIds", headers=h, params={"filter[identifier]": b})
          r.raise_for_status()
          if any(d["attributes"]["identifier"] == b for d in r.json()["data"]):
              print("Zaten kayıtlı:", b); raise SystemExit(0)
          r = requests.post("https://api.appstoreconnect.apple.com/v1/bundleIds", headers=h,
                            json={"data": {"type": "bundleIds", "attributes": {"identifier": b, "name": os.environ["AD"], "platform": "IOS"}}})
          print(r.status_code, r.text[:400]); r.raise_for_status()
          print("Kaydedildi:", b)
          EOF
