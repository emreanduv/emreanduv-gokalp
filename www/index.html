*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gold:#e0b048;--gold2:#b8902e;--ink:#05081a;--cream:#eef2fb;--steel:#8fa3c8;--btn:#2c4a8e;--btnD:#15275a;--panel:#141c3a}
html,body{height:100%;background:#05081a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:"Pixelify Sans",monospace;color:var(--gold)}
#frame{position:fixed;left:6px;right:6px;top:6px;bottom:6px;padding:7px;border:2px solid var(--gold);border-radius:14px;background:#000;box-shadow:0 0 0 3px #1a2350,0 0 0 5px var(--gold2);z-index:1}
#screen{position:relative;width:100%;height:100%;background:#000;border-radius:7px;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:14px;text-align:center}
.ov[hidden]{display:none!important}
.ov.dim{background:rgba(5,8,26,.9)}
.ov h2{font:700 22px "Pixelify Sans",monospace;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}

.mb{min-width:62%;max-width:340px;padding:11px 14px;border:2px solid var(--gold);border-radius:10px;background:rgba(22,32,74,.94);color:#f3d48e;font:700 19px "Pixelify Sans",monospace;box-shadow:0 3px 0 var(--ink)}
.mb.sm{font-size:15px;padding:9px 12px;min-width:0}
.mb[disabled]{opacity:.5;border-color:#5a6480;color:var(--steel)}

.row2{display:flex;gap:10px;justify-content:center;width:100%;max-width:420px}

.lnk{position:absolute;bottom:8px;right:10px;font-size:11px;color:var(--steel)}
#ovSel{justify-content:flex-start;overflow:auto}
.wrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;max-width:380px}

.wrow .s{font:400 13px "Pixelify Sans",monospace;color:var(--cream);opacity:.9}

#ovHelp .list{width:100%;max-width:440px;text-align:left;display:flex;flex-direction:column;gap:7px;margin:4px 0}
#ovHelp .it{background:rgba(22,32,74,.85);border:1px solid #3a4a80;border-radius:8px;padding:7px 9px;color:var(--cream);font-size:13px;line-height:1.35}
#ovHelp .it b,#coach b{color:var(--gold)}
#coach{position:absolute;left:8px;right:8px;top:24px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px;background:rgba(5,8,26,.93);border:2px solid var(--gold);border-radius:10px;color:var(--cream);font-size:14px;line-height:1.4;text-align:center}
#coach[hidden]{display:none}
#coach.soft{pointer-events:none;background:rgba(5,8,26,.8)}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(5,8,26,.92);border:1px solid var(--gold);color:var(--cream);font-size:13px;white-space:nowrap}
#toast[hidden]{display:none}
.tp-odak{outline:3px solid #fff3c0!important;outline-offset:3px}
/* klasik kumanda kabuğu (Tulpar / Kurt Yolu ölçüsü, Gökalp temasında) */
.tp-kabuk{position:fixed;inset:0;z-index:0;touch-action:none;overflow:hidden;
 background:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 60%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 45% 85%,#fff5 50%,transparent 51%),linear-gradient(180deg,#1a2350,#101633 60%,#0a0e24)}
.tp-kabuk[hidden]{display:none}
.tp-ad{position:absolute;color:var(--gold);font:700 17px "Pixelify Sans",monospace;letter-spacing:8px;white-space:nowrap;opacity:.9;text-shadow:1px 1px 0 var(--ink)}
.tp-imza{position:absolute;color:var(--gold);opacity:.8;font:400 12px "Pixelify Sans",monospace;white-space:nowrap;pointer-events:none}
.tp-hac{position:absolute;width:130px;height:130px;transform-origin:0 0}

.tp-hac i.d{left:43px;top:0;width:44px;height:130px;border-radius:9px}
.tp-hac i.y{left:0;top:43px;width:130px;height:44px;border-radius:9px}
.tp-hac i.m{left:45px;top:45px;width:40px;height:40px;border:0;border-radius:0}
.tp-hac b{position:absolute;width:0;height:0;border:9px solid transparent}
.tp-hac .b1{left:56px;top:9px;border-bottom-color:var(--gold)}.tp-hac .b2{left:56px;bottom:9px;border-top-color:var(--gold)}
.tp-hac .b3{left:9px;top:56px;border-right-color:var(--gold)}.tp-hac .b4{right:9px;top:56px;border-left-color:var(--gold)}
.tp-hac.on-yukari .b1{border-bottom-color:#fff3c0}.tp-hac.on-asagi .b2{border-top-color:#fff3c0}.tp-hac.on-sol .b3{border-right-color:#fff3c0}.tp-hac.on-sag .b4{border-left-color:#fff3c0}
.tp-dug{position:absolute;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform-origin:100% 0;
 background:radial-gradient(circle at 35% 30%,#4f78c8,var(--btn) 60%);border:3px solid var(--gold);box-shadow:0 5px 0 var(--btnD);color:#f3d48e;font:700 28px "Pixelify Sans",monospace}
.tp-dug.bas{transform:translateY(4px);box-shadow:0 1px 0 var(--btnD)}
.tp-menu{position:absolute;padding:8px 30px;border-radius:999px;background:#0a0e24;border:2px solid #3a4a80;color:var(--gold);font:700 15px "Pixelify Sans",monospace;letter-spacing:3px;box-shadow:0 4px 0 #04060f}
.tp-menu.bas{transform:translateY(3px);box-shadow:0 1px 0 #04060f}

<script>
(()=>{
'use strict';
let W=256,VH=240;const H=240,T=16,SC=3;
const $=id=>document.getElementById(id);
const cv=$('cv');cv.width=W*SC;cv.height=VH*SC;
let ctx=cv.getContext('2d');ctx.setTransform(SC,0,0,SC,0,0);ctx.imageSmoothingEnabled=false;
const FONT='"Pixelify Sans",monospace';

/* ---------- kayıt ---------- */
let save={};try{save=JSON.parse(localStorage.getItem('gokalp_v1')||'{}')||{};}catch(e){save={};}
save=Object.assign({sound:true,rh:[],best:{tk:0,ay:0,ul:0},cleared:{tk:false,ay:false,ul:false}},save);
save.best=Object.assign({tk:0,ay:0,ul:0},save.best);save.cleared=Object.assign({tk:false,ay:false,ul:false},save.cleared);
function persist(){try{localStorage.setItem('gokalp_v1',JSON.stringify(save));}catch(e){}}

/* ---------- çizim yardımcıları ---------- */
const PAL={k:'#101018',s:'#f0b088',h:'#3a2414',r:'#c83a28',g:'#f0c040',b:'#2a4aa0',m:'#a8b8d0',w:'#f8f8f8',p:'#7a38b0',P:'#3e1a62'};
function polish(c){const x=c.getContext('2d'),w=c.width,h=c.height,id=x.getImageData(0,0,w,h),d=id.data,o=new Uint8ClampedArray(d);
 const lum=i=>(o[i]*.3+o[i+1]*.59+o[i+2]*.11);const sol=(X,Y)=>{if(X<0||Y<0||X>=w||Y>=h)return false;const i=(Y*w+X)*4;return o[i+3]>0&&lum(i)>48;};
 for(let Y=0;Y<h;Y++)for(let X=0;X<w;X++){const i=(Y*w+X)*4;if(!o[i+3]||lum(i)<=48)continue;let f=0;if(!sol(X,Y-1))f=.3;else if(!sol(X,Y+1)||!sol(X+1,Y))f=-.24;else if(!sol(X-1,Y))f=.12;
  if(f>0){d[i]+=(255-d[i])*f;d[i+1]+=(250-d[i+1])*f;d[i+2]+=(235-d[i+2])*f;}else if(f<0){d[i]*=1+f;d[i+1]*=1+f;d[i+2]*=1+f*.7;}}
 x.putImageData(id,0,0);return c;}
function mk(rows){const w=Math.max(...rows.map(r=>r.length)),h=rows.length,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const col=PAL[r[i]];if(col){x.fillStyle=col;x.fillRect(i,y,1,1);}}});return polish(c);}
function flip(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const x=f.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return f;}
function tile(fn){const c=document.createElement('canvas');c.width=c.height=16;fn(c.getContext('2d'));return c;}
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function txt(s,x,y,col='#eef2fb',size=8,align='left',bold=false){ctx.font=(bold?'700 ':'')+size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle='#05081a';ctx.fillText(s,x+.7,y+.7);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.textAlign='left';}

/* Kahraman: sivri miğfer, kırmızı kaftan, altın kuşak */
const TOP=["....kk","...kmmk","..kmmgmk",".kmmmgmmk",".kkkkkkkkk",".khhssssk",".khssskssk",".khsssssk","..kksssk","..kkrrrkk",".krrrgrrrk","krrrrgrrrsk","ksrrrgrrrsk","kskrrgrrkk",".kkrrgrrk",".kggggggk",".krrrrrrk"];
const LA=[".kbbbkbbk",".kbbbkbbk",".kbbk.kbbk",".kbbk.kbbk",".kkkk.kkkk","kkkkk.kkkkk"];
const LB=[".kbbbbbbk","kbbbk.kbbk","kbbk...kbbk","kbk.....kbk","kkk.....kkk","kkk.....kkkk"];
const LJ=[".kbbbbbbk","..kbbbbbk","..kbbk.kbbk",".kkk...kbbk",".kkk....kkk","........kkk"];
const HERO={};[['a',LA],['b',LB],['j',LJ]].forEach(([n,l])=>{const c=mk(TOP.concat(l));HERO[n]={1:c,'-1':flip(c)};});
const HEAD=mk(TOP.slice(0,9));
const GOLGE=mk(["...kkkkkk...","..kppppppk..",".kppppppppk.","kppwkppwkppk","kppkkppkkppk","kppppppppppk","kpppPPPPpppk","kppppppppppk",".kpkppkppkpk","..k.kk.kk.k."]);
const D1=mk(["....kkk...","...kwwwkg.","kkkwwwkwk.","kmmmmwwwk.",".kmmmmwwk.","..kkkkkk..","...k..k..."]);
const D2=mk(["..........","...kkkk...","...kwwwkg.","kkkwwwkwk.","kwwmmmwwk.",".kkkkwwwk.","...kkkkk.."]);
const DOVE={1:[D1,D2],'-1':[flip(D1),flip(D2)]};
const GLYPH=[["x...x","x...x",".x.x.","..x..","..x..","..x..","..x.."],["xxx..","x..x.","x...x","x..x.","xxx..","x....","x...."],["..x..",".x.x.","x...x","..x..","..x..",".x.x.","x...x"]];
function glyph(x,g,px,py,col){x.fillStyle=col;GLYPH[g].forEach((r,j)=>{for(let i=0;i<5;i++)if(r[i]==='x')x.fillRect(px+i,py+j,1,1);});}
const TILES={tk:{},ay:{}};
TILES.tk.fill=tile(x=>{x.fillStyle='#4a5878';x.fillRect(0,0,16,16);x.fillStyle='#2e3850';x.fillRect(0,7,16,1);x.fillRect(0,15,16,1);x.fillRect(0,0,1,7);x.fillRect(8,8,1,7);x.fillStyle='#6a7a9c';x.fillRect(1,0,6,1);x.fillRect(9,8,6,1);x.fillRect(1,0,1,6);x.fillRect(9,8,1,6);});
TILES.tk.top=tile(x=>{x.drawImage(TILES.tk.fill,0,0);x.fillStyle='#9fb0d2';x.fillRect(0,0,16,2);x.fillStyle='#2e3850';x.fillRect(0,2,16,1);});
TILES.tk.rune=tile(x=>{x.drawImage(TILES.tk.fill,0,0);glyph(x,1,5,4,'#c79a34');});
TILES.ay.fill=tile(x=>{x.fillStyle='#9a9eab';x.fillRect(0,0,16,16);const r=rnd(7);x.fillStyle='#80848f';for(let i=0;i<12;i++)x.fillRect(r()*16|0,r()*16|0,1,1);x.fillStyle='#b4b8c4';for(let i=0;i<8;i++)x.fillRect(r()*16|0,r()*16|0,1,1);});
TILES.ay.top=tile(x=>{x.drawImage(TILES.ay.fill,0,0);x.fillStyle='#e2e6ee';x.fillRect(0,0,16,2);x.fillStyle='#c4c8d2';x.fillRect(0,2,16,1);x.fillStyle='#80848f';x.fillRect(5,4,5,1);x.fillRect(4,5,1,2);x.fillRect(10,5,1,2);x.fillRect(5,7,5,1);});
TILES.ay.rune=TILES.ay.fill;
TILES.ul={};TILES.ul.fill=tile(x=>{x.fillStyle='#463664';x.fillRect(0,0,16,16);const r=rnd(11);x.fillStyle='#34284e';for(let i=0;i<14;i++)x.fillRect(r()*16|0,r()*16|0,2,1);x.fillStyle='#6a5a92';for(let i=0;i<8;i++)x.fillRect(r()*16|0,r()*16|0,1,1);});
TILES.ul.top=tile(x=>{x.drawImage(TILES.ul.fill,0,0);x.fillStyle='#d8d0ff';x.fillRect(0,0,16,2);x.fillStyle='#9a8ad0';x.fillRect(0,2,16,1);x.fillStyle='#ffffff';x.fillRect(3,0,2,1);x.fillRect(11,0,1,1);});
TILES.ul.rune=tile(x=>{x.drawImage(TILES.ul.fill,0,0);glyph(x,2,5,4,'#b8a8ff');});

/* ---------- dünyalar ---------- */
const WORLDS={
 tk:{grav:.34,jump:-5.6,W:70,goal:67,
  rects:[[0,13,15,2],[17,13,14,2],[33,11,13,4],[48,13,22,2],[8,9,4,1],[20,9,3,1],[26,7,3,1],[38,7,4,1],[52,9,3,1],[57,7,3,1],[62,10,2,3]],
  stars:[[9,7],[10,7],[11,7],[15,10],[16,10],[21,7],[27,5],[31,9],[32,9],[39,5],[40,5],[46,8],[47,8],[53,7],[58,5],[59,5]],
  foes:[[12,12],[25,12],[41,10],[55,12],[65,12]],cometV:[-1.3,1.1]},
 ay:{grav:.13,jump:-4.2,W:60,goal:57,
  rects:[[0,13,12,2],[16,12,8,3],[28,13,10,2],[43,11,6,4],[53,13,7,2],[6,8,3,1],[20,7,3,1],[25,9,2,1],[33,8,3,1],[39,6,3,1],[47,7,2,1]],
  stars:[[13,9],[14,8],[15,9],[25,7],[26,6],[27,7],[39,4],[40,3],[41,4],[50,9],[51,8],[52,9],[7,6],[21,5]],
  foes:[[19,11],[31,12],[45,10],[56,12]],cometV:[-.9,.6]}
};

 for(let i=0;i<9;i++){const x=Math.round(((i*137-c*.35)%(W+120)+W+120)%(W+120))-60,y=120+(i*53)%70;R(x,y,40,6,'#251846');R(x+6,y+6,28,5,'#1e1338');R(x+14,y+11,12,4,'#180f2e');}}
function drawGoal(c){if(boss&&!boss.dead)return;const gx=cur.goal*T-c,gy=13*T;
 if(lvKey==='tk'){R(gx+4,gy-96,8,96,'#5b6684');for(let y=gy-90;y<gy;y+=12)R(gx+4,y,8,1,'#2e3850');R(gx+3,gy-60,10,2,'#f0c040');R(gx+3,gy-30,10,2,'#f0c040');bigStar(gx+8,gy-106,7+Math.round(Math.sin(frame*.1)*2),'#f0c040');}
 else if(lvKey==='ul'){const y0=12*T;R(gx+2,y0-14,24,14,'#6a5a92');R(gx,y0-16,28,3,'#d8d0ff');[[0,0],[-7,-6],[7,-6],[-10,4],[10,4],[-4,10],[4,10]].forEach(([dx,dy],i)=>bigStar(gx+14+dx,y0-48+dy,2+((frame>>3)+i)%2,i?'#fff0b0':'#ffffff'));}
 else{R(gx+1,gy-40,3,22,'#6a4a2a');R(gx+24,gy-40,3,22,'#6a4a2a');R(gx-2,gy-42,32,3,'#6a4a2a');R(gx+13,gy-39,1,14,'#c8b080');R(gx+11,gy-26,5,4,'#6a4a2a');
  R(gx,gy-18,28,18,'#7c808c');for(let i=0;i<4;i++)R(gx+1+i*7,gy-17,6,5,'#a4a8b4');for(let i=0;i<4;i++)R(gx+4+i*7,gy-10,5,5,'#a4a8b4');
  R(gx+2,gy-20,24,3,'#101018');R(gx+11,gy-20,4,1,'#fff6c0');R(gx+10,gy-19,2,1,'#fff6c0');}}
function drawTiles(c){const TT=TILES[lvKey],x0=Math.floor(c/T);
 for(let ty=0;ty<15;ty++)for(let tx=x0;tx<=x0+Math.ceil(W/T)&&tx<cur.W;tx++){if(!grid[ty][tx])continue;const top=ty===0||!grid[ty-1][tx];
  ctx.drawImage(top?TT.top:((tx*7+ty*13)%11===0?TT.rune:TT.fill),tx*T-c,ty*T);}}
function drawHero(px,py,face,kind,atk){const img=HERO[kind][face],dx=Math.round(face>0?px:px+10-img.width),dy=Math.round(py);ctx.drawImage(img,dx,dy);
 const hx=face>0?dx+9:dx;
 if(atk>0){const y=dy+11;ctx.globalAlpha=.4;R(face>0?hx+1:hx-17,y-1,18,4,'#60e0ff');ctx.globalAlpha=1;
  R(face>0?hx+2:hx-16,y,16,2,'#cfe0f0');R(face>0?hx+2:hx-16,y,16,1,'#fff');R(hx,y-2,2,6,'#f0c040');
  if(atk>7){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.beginPath();if(face>0)ctx.arc(hx,y,18,-1.2,1.2);else ctx.arc(hx+2,y,18,Math.PI-1.2,Math.PI+1.2);ctx.stroke();}}
 else{R(hx,dy+1,2,10,'#cfe0f0');R(hx,dy+1,1,10,'#fff');R(hx-1,dy+11,4,1,'#f0c040');}}
function drawHUD(){R(0,0,W,15,'rgba(5,8,26,.78)');R(0,15,W,1,'#b8902e');txt(t('hp'),5,3,'#fff');for(let i=0;i<6;i++)R(30+i*7,4,5,8,i<pl.hp?'#e03a2a':'#3a2020');
 bigStar(Math.round(W/2)-26,8,3,'#f0c040');txt(String(totalDust()+levelDust).padStart(4,'0')+' / 1923',Math.round(W/2)-18,3,'#f0c040');ctx.drawImage(HEAD,W-30,3);txt('× '+Math.max(0,lives),W-18,3,'#fff');}
function drawWorld(){const c=Math.round(cam),top=VH-H;ctx.save();ctx.translate(0,top);
 if(shake>0)ctx.translate(Math.round((Math.random()-.5)*4),Math.round((Math.random()-.5)*3));
 if(lvKey==='tk')bgTk(c,top);else if(lvKey==='ul')bgUl(c,top);else bgAy(c,top);drawTiles(c);drawGoal(c);
 for(const m of movers){const x=Math.round(m.x-c);R(x,m.y,m.w,4,'#d8d0ff');R(x,m.y+4,m.w,3,'#6a5a92');R(x+4,m.y+7,m.w-8,2,'#3a2c5e');}
 for(const s of stars){if(s.got)continue;const x=s.x-c+5,y=s.y+5+Math.round(Math.sin(frame*.1+s.x));const r=2+((frame>>3)+s.x)%2;R(x-r,y,r*2+1,1,'#f0c040');R(x,y-r,1,r*2+1,'#f0c040');R(x,y,1,1,'#fff');}
 for(const f of foes)if(!f.dead)ctx.drawImage(GOLGE,Math.round(f.x-c),Math.round(f.y));
 if(boss&&!boss.dead)drawBossHD(Object.assign({},boss,{hp:Math.ceil(boss.hp/2)}),Math.round(boss.x-c));
 for(const r of rocks){R(r.x-c-4,r.y-4,8,8,'#5a4e44');R(r.x-c-3,r.y-3,4,3,'#8a7e70');}
 for(const k of comets){for(let i=6;i>0;i--){ctx.globalAlpha=.15*(7-i);R(k.x-c-i*k.vx*3-1,k.y-i*k.vy*3-1,3,3,i>3?'#f08020':'#ffd040');}ctx.globalAlpha=1;R(k.x-c-2,k.y-2,5,5,'#fff6d0');}
 if(!(pl.inv>0&&(frame>>2)%2&&state==='play'))drawHero(pl.x-c,pl.y,pl.face,(state==='dying'||!pl.onG)?'j':(Math.abs(pl.vx)>.2?((pl.anim>>3)%2?'a':'b'):'a'),state==='play'?pl.atk:0);
 ctx.drawImage(DOVE[pl.face][(frame>>3)%2],Math.round(dove.x-c),Math.round(dove.y));
 for(const q of parts){ctx.globalAlpha=Math.min(1,q.l/15);R(q.x-c,q.y,2,2,q.c);}ctx.globalAlpha=1;
 ctx.restore();drawHUD();
 if(bossFight&&boss){R(W/2-60,19,120,11,'rgba(5,8,26,.8)');txt(t('boss'),W/2-56,20,'#e07a5a',8);for(let i=0;i<6;i++)R(W/2-2+i*9,21,7,7,i<boss.hp?'#e07a5a':'#3a2020');}}
function drawTitle(){const top=VH-H,c=Math.round(titleCam);ctx.save();ctx.translate(0,top);bgTk(c,top);const TT=TILES.tk;
 for(let i=0;i<=Math.ceil(W/16);i++){const x=i*16-(c%16);ctx.drawImage(TT.top,x,208);ctx.drawImage(TT.fill,x,224);}
 const mx=28;ctx.drawImage(TT.top,mx,192);ctx.drawImage(TT.top,mx+16,192);drawHero(mx+6,170,1,'a',0);
 ctx.drawImage(DOVE[1][(frame>>3)%2],mx-12,152+Math.round(Math.sin(frame*.08)*3));ctx.restore();}
function drawCard(){R(0,0,W,VH,'#05081a');const cy=Math.round(VH/2);
 if(state==='intro'){txt(t(lvKey),W/2,cy-50,'#e0b048',16,'center',true);txt(t(GRAVK[lvKey]),W/2,cy-28,'#8fa3c8',8,'center');if(cur.boss)txt(t('yel'),W/2,cy+58,'#e07a5a',8,'center');
  ctx.drawImage(HEAD,W/2-22,cy-6);txt('× '+lives,W/2-8,cy-5,'#eef2fb',9);bigStar(W/2-24,cy+24,3,'#f0c040');txt(String(totalDust()).padStart(4,'0')+' / 1923',W/2-16,cy+19,'#f0c040',8);
  txt(t('ready'),W/2,cy+44,'#eef2fb',8,'center');}
 else{txt(t('over1'),W/2,cy-40,'#e0b048',16,'center',true);txt(t('over2'),W/2,cy-14,'#eef2fb',8,'center');if((frame>>5)%2&&stateT>40)txt(t('over3'),W/2,cy+12,'#fff6d0',9,'center');}}
function draw(){ctx.setTransform(SC,0,0,SC,0,0);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,W,VH);
 if(state==='title')drawTitle();else if(state==='intro'||state==='gameover')drawCard();else if(pl)drawWorld();
 if(uiPaused()&&state!=='title')R(0,0,W,VH,'rgba(0,0,0,.3)');}

let acc=0,last=performance.now();
function loop(now){requestAnimationFrame(loop);girisTick();let dt=now-last;last=now;if(dt>100)dt=100;acc+=dt;
 while(acc>=1000/60){acc-=1000/60;if(!uiPaused())update();}
 draw();musicTick();}
window.__gokalp={get state(){return state;},get pl(){return pl;},startGame,inp,kaynak,get save(){return save;}};
function boot(){applyLang();yerlesTekrar();show('ovLang');requestAnimationFrame(loop);}
(document.fonts&&document.fonts.load?Promise.race([Promise.all([document.fonts.load('8px "Pixelify Sans"','ıİşŞğĞçÇöÖüÜ'),document.fonts.load('700 8px "Pixelify Sans"','ıİşŞğĞçÇöÖüÜ')]),new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(boot,boot);
})();
